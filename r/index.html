<body>

<a id="destination" hidden>開啟 Google 評論</a>
<noscript>請開啟 JavaScript 以查看分店評論。</noscript>
<script>
// Keep these codes assigned to the same branches when adding locations.
const branches={

  b:['德惠店','ChIJd6GbOaYPbjQRc6HbG-6bxhk'],
  c:['小港店','ChIJCWvzxEwdbjQRODP603QqwQM'],

  e:['斗六一店','ChIJx-LKy9_JbjQRDgYJplzHA5w'],
  f:['十全店','ChIJ-Y_e56kFbjQRkGuAa1MJb64'],
  g:['陽明店','ChIJa95U69IEbjQRBKl2b5M6tDw'],
  h:['福山店','ChIJT6wlgvAFbjQRNU2m04xtjOE'],
  i:['光遠店','ChIJa-KAojgbbjQRawmvV9qJjkA'],

  q:['明誠店','ChIJVTmPOasFbjQRzGWKo58fcPg'],
  r:['瑞隆店','ChIJ203-ScoDbjQR1TwdGsScuDI'],
  s:['鼎中店','ChIJsW3ZDoIFbjQRLhQGdjXFsfk'],
  t:['武廟店','ChIJ4-zUfvwFbjQRIwIsh-33gD0'],
  u:['一心店','ChIJD_0T1WIDbjQRInkTw8o-IIs'],

const code=location.search.slice(1);
const statusText=document.getElementById('status');
if(Object.hasOwn(branches,code)){
  const [branch,placeId]=branches[code];
  const url='https://search.google.com/local/reviews?placeid='+placeId;
  const link=document.getElementById('destination');
  link.href=url;
  link.textContent='開啟'+branch+' Google 評論';
  link.hidden=false;
  statusText.textContent='正在開啟'+branch+'的 Google 評論…';
  location.replace(url);
}else{
  statusText.textContent='找不到這間分店，請點選 LINE 訊息底部的完整連結。';
}
</script>
