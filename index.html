<script>
'use strict';
const $ = id => document.getElementById(id);

function endpoint(value) {
  if (!value) return '';

    const result = new URL(value, location.href);
    if (result.username || result.password || result.search || result.hash) return '';
    if (result.protocol !== 'https:' && !(result.protocol === 'http:' && ['localhost','127.0.0.1'].includes(result.hostname))) return '';

  } catch { return ''; }
}
const origin = endpoint(conf.api);
const backendLink = endpoint(conf.backend);
const privateOrigin=origin ? new URL(origin).origin : '';

const stampFormat = new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});

const waiting=new Map();
function bridgeClosed() {
  if(!bridgeWindow)return true;
  try{return bridgeWindow.closed;}catch{return false;}
}
function bridgeLive(){return Boolean(bridgePort && !bridgeClosed());}
function disconnectRelay(){
  if(bridgePort)bridgePort.close();

const officialLineURL='https://lin.ee/9nRsU3Q';
const standardContact=/^囍事快剪官方[ \t　]*LINE[ \t　]*https:\/\/lin\.ee\/9nRsU3Q[ \t　]*\n也可在[ \t　]*LINE[ \t　]*選「加入好友」[ \t　]*→[ \t　]*「搜尋」[ \t　]*→[ \t　]*「電話號碼」，輸入[ \t　]*0988-225559。[ \t　]*\n公司客服電話[ \t　]*0988-225559[ \t　]*$/m;
function noticeParagraphs(text){
  return text.trim().replace(/\r\n?/g,'\n').split(/\n{2,}/u).map(paragraph=>
    paragraph.split('\n').map(line=>{
      if(line.length<90)return line;
      let start=0;
      return line.replace(/[。！？][」』”）]*|[.!?](?=\s)|[，；]/gu,(end,pos)=>{
        const next=pos+end.length;
        const target=/[，；]/u.test(end)?88:48;
        if(next-start<target || line.length-next<16)return end;
        start=next;
        return end+'\n\n';
      });
    }).join('\n')
  ).join('\n\n');
}
function reviewNotice(row,desktop=false){
  const reply=row.reply.replace(/\r\n?/g,'\n').trim();
  const hasContact=standardContact.test(reply);
  const body=reply.replace(standardContact,'').trim();
  const sections=[row.branch+'｜Google 評論　'+row.stars+' 星',
    '── 顧客評論 ──\n'+(row.comment.trim()?noticeParagraphs(row.comment):'（僅留下星等）')];
  // Identify an App paragraph only when both store names occur on the same line.
  const appLine=/^(?=[^\n]*App Store)(?=[^\n]*Google Play)[^\n]+$/im.exec(body);
  let appStart=appLine?.index ?? -1;
  if(appLine){
    const firstStore=appLine[0].search(/App Store|Google Play/i);
    const beforeStore=appLine[0].slice(0,firstStore);
    const lastStop=Math.max(beforeStore.lastIndexOf('。'),beforeStore.lastIndexOf('！'),beforeStore.lastIndexOf('？'));
    if(lastStop>=0)appStart+=lastStop+1;
  }
  const main=appStart<0?body:body.slice(0,appStart).trim();
  sections.push('── 店家回覆 ──'+(main?'\n'+noticeParagraphs(main):''));
  if(appLine){
    const end=appLine.index+appLine[0].length;
    sections.push('── App 資訊 ──\n'+noticeParagraphs(body.slice(appStart,end)));
    const rest=body.slice(end).trim();
    if(rest)sections.push('── 回覆補充 ──\n'+noticeParagraphs(rest));
  }
  let shareLink='';
  if(hasContact){
    // On desktop LINE appends the supplied link. Give it the existing contact link once.
    sections.push('── 聯絡方式 ──\n客服電話　0988-225559\n用此號碼加 LINE 好友\n「加入好友」→「搜尋」→「電話號碼」\n官方 LINE'+(desktop?'':'　'+officialLineURL));
    if(desktop)shareLink=officialLineURL;
  }else if(desktop && Object.hasOwn(branchMapIds,row.branch)){
    shareLink='https://maps.google.com/maps?cid='+branchMapIds[row.branch];
    sections.push('分店地圖');
  }
  return {text:sections.join('\n\n'),shareLink};
}
function personalShareURL(row){
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const notice=reviewNotice(row,!mobile);
  if(mobile)return 'https://line.me/R/share?text='+encodeURIComponent(notice.text);
  if(!notice.shareLink)return '';
  return 'https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(notice.shareLink)+'&text='+encodeURIComponent(notice.text);
}
function manualCopy(row,text){
  const field=$('share-manual');field.hidden=false;field.value=text;field.focus();field.select();
  $('share-feedback').textContent='請複製下方完整通知，再貼到「'+row.branch+'」的 LINE 群組。';
}
async function copyNotice(row){
  const {text}=reviewNotice(row);
  try{
    await navigator.clipboard.writeText(text);
    if(active===row.id && token)$('share-feedback').textContent='已複製通知，請在個人 LINE 選擇「'+row.branch+'」群組後貼上。';
  }catch{
    if(active===row.id && token)manualCopy(row,text);
  }
}
$('share-line').onclick=()=>{
  const row=reviews.get(active);if(!canShareReview(row))return;
  const url=personalShareURL(row);
  // Some browsers or LINE reject long request URLs. Preserve every character via clipboard.
  if(!url || url.length>8000){copyNotice(row);return;}
  window.open(url,'_blank','noopener,noreferrer');
  $('share-feedback').textContent='請在 LINE 選擇「'+row.branch+'」群組並送出。若分享視窗未開啟，可使用「複製通知」。';
};
$('copy-share').onclick=()=>{const row=reviews.get(active);if(canShareReview(row))copyNotice(row);};
$('mark-shared').onchange=async event=>{
  const row=reviews.get(active);
  if(!canShareReview(row)||sharedUpdates.has(row.id))return;
  const shared=event.target.checked, identity=session;
  sharedUpdates.set(row.id,shared);
  renderDetail();
  try{
    const data=await api('/api/shared','PUT',{id:row.id,rev:row.rev,shared});
    if(identity!==session)return;
    const saved=normalized(data.review);
    if(saved?.id!==row.id || saved.shared!==shared)throw new ApiError('未收到分享標記的儲存確認。');
    register(saved);
    note(row.id,shared?'已儲存分享標記。':'已取消分享標記。');
  }catch(err){
    if(identity!==session || !token)return;
    if(err.status===409 || !err.status || err.status>=500)await load({quiet:true});
    if(identity===session && token)note(row.id,'請核對分享標記。'+err.message,true);
  }finally{
    if(identity===session){sharedUpdates.delete(row.id);renderList();}
  }
};
